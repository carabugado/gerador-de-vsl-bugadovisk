<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Anúncio Reels 9:16</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .phone { position: relative; width: 540px; height: 960px; color: #fff; overflow: hidden; }
  .phone svg { filter: drop-shadow(0 1px 4px rgba(0,0,0,.55)); }
  .txt { text-shadow: 0 1px 6px rgba(0,0,0,.55); }

  .toptitle { position:absolute; top:26px; left:18px; font-size:22px; font-weight:700; }
  .topcam { position:absolute; top:26px; right:16px; }

  .rail { position:absolute; right:10px; bottom:120px; display:flex; flex-direction:column; align-items:center; gap:19px; }
  .rail .item { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .rail .count { font-size:12.5px; font-weight:600; }
  .album { width:30px; height:30px; border-radius:7px; background:linear-gradient(140deg,#8b4dff,#35235e); border:2px solid #fff; }

  .meta { position:absolute; left:14px; right:86px; bottom:120px; }
  .prow { display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(140deg,#8b4dff,#6a2bef); border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; }
  .pnames { display:flex; flex-direction:column; }
  .handle { font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:5px; }
  .verified { width:13px; height:13px; border-radius:50%; background:#0095F6; color:#fff; font-size:8.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
  .sponsored { font-size:12px; color:rgba(255,255,255,.85); }
  .caption { font-size:14px; line-height:1.35; }

  .cta { position:absolute; left:14px; right:86px; bottom:56px; height:44px; border-radius:8px; background:#0095F6; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:15px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.3); }

  .homebar { position:absolute; left:50%; transform:translateX(-50%); bottom:10px; width:130px; height:4.5px; border-radius:3px; background:rgba(255,255,255,.9); box-shadow:0 1px 4px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div class="phone">

  <div class="toptitle txt">Reels</div>
  <div class="topcam"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2.5" y="3" width="19" height="18" rx="4.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="18" cy="6.6" r="1.1" fill="#fff" stroke="none"/></svg></div>

  <aside class="rail">
    <div class="item"><svg width="31" height="29" viewBox="0 0 24 22" fill="none" stroke="#fff" stroke-width="1.9"><path d="M12 20.5C7 16.5 1.5 12.6 1.5 7.5A5.6 5.6 0 0 1 7 1.5c2.2 0 4 1.2 5 3 1-1.8 2.8-3 5-3a5.6 5.6 0 0 1 5.5 6c0 5.1-5.5 9-10.5 13z"/></svg><span class="count txt">43,2K</span></div>
    <div class="item"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><path d="M12 2.5a9.5 9.5 0 0 1 0 19c-1.7 0-3.2-.4-4.6-1.1L2.5 21.5l1.2-4.7A9.5 9.5 0 0 1 12 2.5z"/></svg><span class="count txt">318</span></div>
    <div class="item"><svg width="30" height="28" viewBox="0 0 24 22" fill="none" stroke="#fff" stroke-width="1.9"><path d="M22 1 2.5 8.8l7 2.7L12 19l3-6.5z"/></svg><span class="count txt">1.024</span></div>
    <div class="item" style="letter-spacing:2px;font-weight:800;font-size:16px;" class="txt">•••</div>
    <div class="album"></div>
  </aside>

  <div class="meta">
    <div class="prow">
      <div class="avatar">G</div>
      <div class="pnames">
        <span class="handle txt">guideify.app <span class="verified">✓</span></span>
        <span class="sponsored txt">Patrocinado</span>
      </div>
    </div>
    <div class="caption txt">A régua que faltava no Premiere 📐 Guias e safe zones em 1 clique</div>
  </div>

  <div class="cta"><span>Saiba mais</span><svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="m1.5 1.5 6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>

  <div class="homebar"></div>

</div>
</body>
</html>
