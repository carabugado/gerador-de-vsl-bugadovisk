<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Anúncio TikTok 9:16</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .phone { position: relative; width: 540px; height: 960px; color: #fff; overflow: hidden; }
  .phone svg, .phone .txt { filter: drop-shadow(0 1px 4px rgba(0,0,0,.55)); }
  .txt { text-shadow: 0 1px 6px rgba(0,0,0,.55); }

  .topbar { position:absolute; top:24px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:22px; font-size:16px; }
  .topbar .faint { color: rgba(255,255,255,.65); }
  .topbar .cur { font-weight:700; position:relative; }
  .topbar .cur::after { content:""; position:absolute; left:25%; right:25%; bottom:-7px; height:3px; background:#fff; border-radius:2px; }
  .topsearch { position:absolute; top:22px; right:16px; }
  .toplive { position:absolute; top:22px; left:16px; }

  .rail { position:absolute; right:8px; bottom:200px; display:flex; flex-direction:column; align-items:center; gap:17px; }
  .rail .item { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .rail .count { font-size:12.5px; font-weight:600; }
  .avatar-wrap { position:relative; margin-bottom:6px; }
  .avatar { width:46px; height:46px; border-radius:50%; background:linear-gradient(140deg,#8b4dff,#6a2bef); border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; }
  .plus { position:absolute; left:50%; bottom:-9px; transform:translateX(-50%); width:19px; height:19px; border-radius:50%; background:#FE2C55; color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .disc { width:42px; height:42px; border-radius:50%; background:#1a1a1a; border:11px solid #333; box-shadow:0 1px 4px rgba(0,0,0,.5); }

  .meta { position:absolute; left:14px; right:100px; bottom:150px; }
  .sponsored { display:inline-block; font-size:11.5px; font-weight:600; color:#fff; background:rgba(255,255,255,.22); border-radius:3px; padding:2px 7px; margin-bottom:8px; }
  .handle { font-size:16.5px; font-weight:700; margin-bottom:6px; }
  .caption { font-size:14.5px; line-height:1.35; margin-bottom:8px; }
  .sound { display:flex; align-items:center; gap:7px; font-size:13.5px; }

  .cta { position:absolute; left:14px; right:100px; bottom:92px; height:42px; border-radius:5px; background:#FE2C55; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:15px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.3); }

  .nav { position:absolute; left:0; right:0; bottom:0; height:64px; background:#000; display:flex; align-items:center; justify-content:space-around; padding:0 6px; }
  .nav .ni { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; color:rgba(255,255,255,.85); }
  .nav .ni.on { color:#fff; font-weight:700; }
  .newbtn { width:42px; height:27px; background:#fff; border-radius:8px; position:relative; display:flex; align-items:center; justify-content:center; color:#000; font-weight:800; font-size:17px; }
  .newbtn::before { content:""; position:absolute; left:-5px; top:0; bottom:0; width:10px; background:#25F4EE; border-radius:8px; z-index:-1; }
  .newbtn::after  { content:""; position:absolute; right:-5px; top:0; bottom:0; width:10px; background:#FE2C55; border-radius:8px; z-index:-1; }
</style>
</head>
<body>
<div class="phone">

    <div class="item"><svg width="28" height="32" viewBox="0 0 18 22" fill="#fff"><path d="M2 1h14a1 1 0 0 1 1 1v19l-8-5-8 5V2a1 1 0 0 1 1-1z"/></svg><span class="count">12,5K</span></div>
    <div class="item"><svg width="34" height="30" viewBox="0 0 24 20" fill="#fff"><path d="M13 3.5 22 10l-9 6.5V13c-5 0-8.5 1.5-11 5 .8-6.5 4.5-10.5 11-11V3.5z"/></svg><span class="count">8.234</span></div>
    <div class="disc"></div>
  </aside>

  <div class="meta">
    <span class="sponsored txt">Patrocinado</span>
    <div class="handle txt">@guideify.app</div>

    <div class="sound txt"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M9 18.5a3 3 0 1 1-2-2.83V5l12-2.5v12a3 3 0 1 1-2-2.83V6.3L9 8.4z"/></svg>Guideify · Som original</div>
  </div>

  <div class="cta"><span>Saiba mais</span><svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="m1.5 1.5 6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>

  <nav class="nav">
    <div class="ni on"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 2 10.5h2.5V21h6v-6h3v6h6V10.5H22z"/></svg>Início</div>
    <div class="ni"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9.5" r="2.6"/><path d="M15.8 14.7c2.9.2 5 1.9 5.7 5.3"/></svg>Amigos</div>
    <div class="ni"><div class="newbtn">+</div></div>
    <div class="ni"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 5h18v13H8l-5 4z"/></svg>Caixa de entrada</div>
    <div class="ni"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/></svg>Perfil</div>

</div>
</body>
</html>
