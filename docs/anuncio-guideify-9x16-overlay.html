<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guideify — Anúncio Stories 9:16</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #16181d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  .hint { color: #8a8f98; font-size: 13px; }

  /* ===== moldura 9:16 ===== */
  .phone {
    position: relative;
    height: min(calc(100vh - 70px), 920px);
    aspect-ratio: 9 / 16;
    border-radius: 24px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    color: #fff;
  }

  /* ===== fundo = área do vídeo ===== */
  .video-bg {
    position: absolute; inset: 0 0 7% 0;
    background:
      radial-gradient(60% 40% at 30% 22%, rgba(255,255,240,.28), transparent 70%),
      radial-gradient(80% 60% at 75% 70%, rgba(0,0,0,.35), transparent 75%),
      linear-gradient(165deg, #3f7a66 0%, #2f5d4f 45%, #24483d 100%);
  }
  .video-bg::after {
    content: "▶  seu vídeo 9:16 aqui";
    position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,.45);
    border: 1px dashed rgba(255,255,255,.35);
    border-radius: 8px; padding: 8px 14px; white-space: nowrap;
  }

  /* ===== barra de status ===== */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px 0;
    font-size: 15px; font-weight: 600;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  .back {
    position: absolute; top: 6.2%; left: 14px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    opacity: .9; cursor: pointer;
  }

  /* ===== mudo ===== */
  .mute {
    position: absolute; top: 43%; left: 50%; transform: translate(-50%, -50%);
    width: 62px; height: 62px; border-radius: 50%;
    background: rgba(80,80,80,.45);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== headline sobre o vídeo ===== */
  .headline {
    position: absolute; left: 8%; right: 8%; top: 60.5%;
    text-align: center;
    font-size: clamp(15px, 4.6cqw, 22px);
    font-weight: 600;
    text-shadow: 0 1px 10px rgba(0,0,0,.55);
    outline: none;
  }

  /* ===== perfil ===== */
  .profile {
    position: absolute; left: 4%; top: 64.9%;
    display: flex; align-items: center; gap: 8px;
    z-index: 3;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(140deg, #8b4dff, #6a2bef);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; color: #fff;
    box-shadow: 0 0 0 2px rgba(255,255,255,.9);
  }
  .handle { font-size: 15px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .verified {
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; color: #111;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800;
  }

  /* ===== card + CTA ===== */
  .adunit {
    position: absolute; left: 4%; right: 15%; top: 67%;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    z-index: 2;
  }
  .card {
    display: flex; align-items: center; gap: 12px;
    background: rgba(60,60,60,.72);
    backdrop-filter: blur(6px);
    padding: 12px;
  }
  .thumb {
    flex: none;
    width: 56px; height: 56px; border-radius: 10px;
    background:
      radial-gradient(50% 50% at 35% 30%, rgba(255,255,255,.35), transparent 70%),
      linear-gradient(150deg, #8b4dff, #35235e);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px;
  }
  .card p { font-size: 15px; line-height: 1.35; outline: none; }
  .cta {
    display: flex; align-items: center; justify-content: space-between;
    background: #ee6b60;
    padding: 14px 16px;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
  }

  /* ===== legenda / patrocinado ===== */
  .caption {
    position: absolute; left: 4%; right: 16%; top: 86.5%;
    font-size: 15px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 6px rgba(0,0,0,.5);
    outline: none;
  }
  .sponsored {
    position: absolute; left: 4%; top: 89.6%;
    font-size: 13px; color: rgba(255,255,255,.75);
    text-shadow: 0 1px 6px rgba(0,0,0,.5);
  }

  /* ===== coluna de ações ===== */
  .rail {
    position: absolute; right: 3.5%; top: 62%;
    display: flex; flex-direction: column; align-items: center; gap: 17px;
    z-index: 3;
  }
  .rail .action { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .rail .label { font-size: 12px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .rail svg { filter: drop-shadow(0 1px 4px rgba(0,0,0,.5)); }
  .appchip {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(140deg, #8b4dff, #6a2bef);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.95);
  }

  /* ===== campo de comentário ===== */
  .commentbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 7%;
    background: #000;
    display: flex; align-items: center;
    padding: 0 18px;
  }
  .commentbar span { color: #9a9a9a; font-size: 15px; }
</style>
</head>
<body>

<div class="phone">
  

  <div class="statusbar">
    <span>18:43</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 12 5.4 8.8a4.4 4.4 0 0 1 6.2 0zM3.2 6.5a7.5 7.5 0 0 1 10.6 0l-1.8 1.9a4.9 4.9 0 0 0-7 0zM.9 4.2a10.7 10.7 0 0 1 15.2 0l-1.8 1.8a8.2 8.2 0 0 0-11.6 0z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="17.5" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4a2.2 2.2 0 0 0 0-4z" fill="#fff" fill-opacity=".5"/></svg>
      <span style="font-size:13px">87</span>
    </span>
  </div>

  <div class="back">
    <svg width="12" height="21" viewBox="0 0 12 21" fill="none"><path d="M10.5 1.5 2 10.5l8.5 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="mute">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="m16 9 5 6m0-6-5 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
  </div>

  <div class="headline" contenteditable="true">Eu parei de perder tempo no Premiere</div>

  <div class="profile">
    <div class="avatar">G</div>
    <span class="handle" contenteditable="true">guideify.app</span>
    <span class="verified">✓</span>
  </div>

  <div class="adunit">
    <div class="card">
      <div class="thumb">G</div>
      <p contenteditable="true">Teste isso e edite mais rápido no Premiere Pro</p>
    </div>
    <div class="cta">
      <span contenteditable="true">Saiba mais</span>
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="m1.5 1.5 6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="caption" contenteditable="true">🖤 Black Friday Guideify — 50% OFF …</div>
  <div class="sponsored">Patrocinado</div>

  <aside class="rail">
    <div class="action">
      <svg width="27" height="25" viewBox="0 0 24 22" fill="none"><path d="M12 20.5C7 16.5 1.5 12.6 1.5 7.5A5.6 5.6 0 0 1 7 1.5c2.2 0 4 1.2 5 3 1-1.8 2.8-3 5-3a5.6 5.6 0 0 1 5.5 6c0 5.1-5.5 9-10.5 13z" stroke="#fff" stroke-width="1.8"/></svg>
      <span class="label">Curtidas</span>
    </div>
    <div class="action">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2.5a9.5 9.5 0 0 1 0 19c-1.7 0-3.2-.4-4.6-1.1L2.5 21.5l1.2-4.7A9.5 9.5 0 0 1 12 2.5z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <div class="action">
      <svg width="26" height="24" viewBox="0 0 24 22" fill="none"><path d="M22 1 2.5 8.8l7 2.7L12 19l3-6.5z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
    <div class="action" style="letter-spacing:2px;font-weight:800;font-size:17px;">•••</div>
    <div class="appchip">G</div>
  </aside>

  <div class="commentbar"><span>Faça um comentário...</span></div>
</div>

<p class="hint">✏️ Os textos são editáveis — clique em qualquer texto do anúncio para trocar a copy.</p>

</body>
</html>
<style>
  /* versão overlay: fundo 100% transparente, moldura exata 9:16 */
  body { background: transparent; padding: 0; }
  .hint { display: none; }
  .phone {
    width: 540px; height: 960px; aspect-ratio: auto;
    border-radius: 0; box-shadow: none; background: transparent;
  }
  .commentbar { background: rgba(0,0,0,.85); }
</style>
